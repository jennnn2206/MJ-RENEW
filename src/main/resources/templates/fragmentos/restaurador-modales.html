<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="restaurador-modales">
    <!-- MODAL: Evaluar y cotizar -->
    <div class="modal-overlay" id="modal-quote">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="font-family:'Playfair Display',serif">Evaluar y cotizar</h3>
                <button class="modal-close" onclick="Modal.close('modal-quote')">×</button>
            </div>
            <div id="modal-quote-piece" style="background:var(--bg2);border-radius:8px;padding:12px;margin-bottom:20px;font-size:1rem;color:var(--ink2)"></div>

            <p class="eyebrow" style="margin-bottom:10px">Cotización</p>
            <div class="grid-2">
                <div class="form-group"><label class="form-label">Costo mínimo (MXN)</label><input type="number" id="q-costo-min" class="form-control" placeholder="Ej. 4500"></div>
                <div class="form-group"><label class="form-label">Costo máximo (MXN)</label><input type="number" id="q-costo-max" class="form-control" placeholder="Ej. 6500"></div>
            </div>
            <div class="form-group"><label class="form-label">Tiempo estimado (semanas)</label><input type="number" id="q-tiempo" class="form-control" placeholder="Ej. 3"></div>
            <div class="form-group"><label class="form-label">Descripción del proceso</label><textarea id="q-desc" class="form-control" rows="3" placeholder="Describe el proceso de restauración que realizarías..."></textarea></div>

            <div id="q-error" class="form-error"></div>
            <div style="display:flex;gap:10px">
                <button class="btn btn-primary" id="q-submit" onclick="sendQuote()">Confirmar evaluación y enviar cotización</button>
                <button class="btn btn-ghost" onclick="Modal.close('modal-quote')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Actualizar avance -->
    <div class="modal-overlay" id="modal-progress">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="font-family:'Playfair Display',serif">Publicar avance</h3>
                <button class="modal-close" onclick="Modal.close('modal-progress')">×</button>
            </div>
            <div class="form-group"><label class="form-label">Descripción del avance</label><textarea id="p-desc" class="form-control" rows="3" placeholder="Describe el progreso realizado..."></textarea></div>
            <div class="form-group">
                <label class="form-label">URLs de fotografías (una por línea)</label>
                <textarea id="p-fotos" class="form-control" rows="2" placeholder="https://... (opcional, pero recomendado)"></textarea>
            </div>
            <div id="p-error" class="form-error"></div>
            <div style="display:flex;gap:10px">
                <button class="btn btn-primary" onclick="saveProgress()">Publicar avance</button>
                <button class="btn btn-ghost" onclick="Modal.close('modal-progress')">Cancelar</button>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
