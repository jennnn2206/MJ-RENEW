<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de pieza — MJ Renew</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header" id="site-header"></header>

<!-- Breadcrumb -->
<div style="background:var(--bg2);border-bottom:1px solid var(--bg3);padding:12px 0">
  <div class="container">
    <div style="display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--ink2)">
      <a th:href="@{/}" class="nav-link">Inicio</a>
      <span>›</span>
      <a th:href="@{/catalogo}" style="color:var(--ink2)">Catálogo</a>
      <span>›</span>
      <span id="breadcrumb-name" style="color:var(--ink)"></span>
    </div>
  </div>
</div>

<div class="container" style="padding-top:40px;padding-bottom:60px">
  <div id="piece-content">
    <div class="empty-state">
      <h3>Cargando pieza...</h3>
    </div>
  </div>
</div>

<!-- Related pieces -->
<div style="background:var(--bg2);padding:60px 0">
  <div class="container">
    <div class="section-header" style="margin-bottom:28px">
      <span class="eyebrow">Explora más</span>
      <h3 style="font-family:'Playfair Display',serif;font-size:1.4rem">Piezas relacionadas</h3>
    </div>
    <div class="catalog-grid" id="related-grid"></div>
  </div>
</div>

<!-- Modal: Comprar -->
<div class="modal-overlay" id="modal-buy">
  <div class="modal-box">
    <div class="modal-header">
      <h3 style="font-family:'Playfair Display',serif">Comprar pieza</h3>
      <button class="modal-close" onclick="Modal.close('modal-buy')">×</button>
    </div>
    <div id="buy-piece-name" style="background:var(--bg2);border-radius:8px;padding:12px;margin-bottom:20px;font-weight:600;color:var(--ink)"></div>
    <p style="font-size:1rem;color:var(--ink2);margin-bottom:20px">Al confirmar, se genera un link de pago (por ahora simulado) y la pieza queda reservada.</p>
    <div id="buy-error" class="form-error"></div>
    <div id="buy-success" style="display:none;background:var(--bg2);border-radius:8px;padding:14px;margin-bottom:16px;word-break:break-all"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-gold btn-lg" id="buy-confirm-btn" onclick="confirmPurchase()" style="flex:2;justify-content:center">Confirmar compra</button>
      <button class="btn btn-ghost" onclick="Modal.close('modal-buy')" style="flex:1;justify-content:center">Cancelar</button>
    </div>
  </div>
</div>

<div th:replace="~{fragmentos/pie-pagina :: pie-pagina('/catalogo', '← Volver al catálogo')}"></div>

<script th:src="@{/js/data/afd-estados.js}"></script>
<script th:src="@{/js/data/catalogo.js}"></script>
<script th:src="@{/js/data/restauradores.js}"></script>
<script th:src="@{/js/data/piezas-propietario.js}"></script>
<script th:src="@{/js/data/panel-restaurador.js}"></script>
<script th:src="@{/js/autenticacion.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/utilidades.js}"></script>
<script th:src="@{/js/notificaciones.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
  renderHeader(false);

  const params = new URLSearchParams(window.location.search);
  const catalogoId = params.get('id');
  let piece = null;

  async function cargarPieza() {
    if (!catalogoId) { mostrarNoEncontrada(); return; }
    try {
      piece = await Api.detallePiezaCatalogo(catalogoId);
    } catch (err) {
      mostrarNoEncontrada();
      return;
    }
    renderPieza();
    cargarRelacionadas();
  }

  function mostrarNoEncontrada() {
    document.getElementById('piece-content').innerHTML = `
      <div class="empty-state">
        <h3>Pieza no encontrada</h3>
        <p>Esta pieza ya no está disponible o el enlace es incorrecto.</p>
        <a th:href="@{/catalogo}" class="btn btn-primary">Ver el catálogo</a>
      </div>
    `;
  }

  function renderPieza() {
    const nombre = tipoMuebleLabel(piece.tipoMueble);
    document.title = `${nombre} — MJ Renew`;
    document.getElementById('breadcrumb-name').textContent = nombre;

    const dim = piece.dimension;
    const dimTexto = dim ? `${dim.altoCm ?? '—'} × ${dim.anchoCm ?? '—'} × ${dim.profundidadCm ?? '—'} cm` : 'No especificadas';
    const pesoTexto = dim && dim.pesoKg ? `${dim.pesoKg} kg` : 'No especificado';

    document.getElementById('piece-content').innerHTML = `
      <div class="piece-detail-layout">
        <div class="piece-gallery">
          <img id="main-img" src="${fotoConFallback(piece.urlFotoPortada)}" alt="${nombre}" class="piece-main-img">
        </div>

        <div class="piece-info-panel">
          <div style="margin-bottom:8px">
            <span class="eyebrow">${estiloMuebleLabel(piece.estiloMueble) || 'Restaurada por MJ Renew'}</span>
            <h2 style="font-size:1.7rem;margin-bottom:0">${nombre}</h2>
          </div>

          <div class="piece-info-price">${Utils.formatCurrency(piece.precioMxn)}</div>

          <span class="badge badge-green" style="margin-bottom:16px;display:inline-flex">Restaurado</span>

          <div class="piece-specs">
            <div class="spec-item"><div class="spec-label">Material</div><div class="spec-value">${materialMuebleLabel(piece.materialMueble) || '—'}</div></div>
            <div class="spec-item"><div class="spec-label">Estilo</div><div class="spec-value">${estiloMuebleLabel(piece.estiloMueble) || '—'}</div></div>
            <div class="spec-item"><div class="spec-label">Dimensiones</div><div class="spec-value">${dimTexto}</div></div>
            <div class="spec-item"><div class="spec-label">Peso</div><div class="spec-value">${pesoTexto}</div></div>
          </div>

          <hr class="divider">

          <h4 style="margin-bottom:8px">Historia de la pieza</h4>
          <p style="font-size:1rem">${piece.procedenciaMueble || 'Sin información adicional.'}</p>

          <hr class="divider">

          <div style="display:flex;flex-direction:column;gap:10px">
            <button class="btn btn-gold btn-lg" style="width:100%;justify-content:center" onclick="openBuyModal()">
              Comprar pieza
            </button>
          </div>

          <div style="margin-top:16px;padding:12px;background:var(--bg2);border-radius:8px;font-size:1rem;color:var(--ink2);text-align:center">
            Pago seguro · Certificado de autenticidad incluido · Envío coordinado
          </div>
        </div>
      </div>
    `;
  }

  async function cargarRelacionadas() {
    try {
      const page = await Api.explorarCatalogo();
      const todas = page.content || [];
      const relacionadas = todas.filter(p => p.catalogoId !== catalogoId && p.tipoMueble === piece.tipoMueble).slice(0, 4);
      const finales = relacionadas.length ? relacionadas : todas.filter(p => p.catalogoId !== catalogoId).slice(0, 4);
      document.getElementById('related-grid').innerHTML = finales.length ? finales.map(p => `
        <div class="piece-card" onclick="window.location.href='/pieza?id=${p.catalogoId}'">
          <div class="piece-card-img-wrap">
            <img src="${fotoConFallback(p.urlFotoPortada)}" alt="${tipoMuebleLabel(p.tipoMueble)}" loading="lazy">
          </div>
          <div class="piece-card-body">
            <div class="piece-card-tag">${tipoMuebleLabel(p.tipoMueble)}</div>
            <h4>${tipoMuebleLabel(p.tipoMueble)}</h4>
            <div class="piece-card-meta"><span class="piece-card-price">${Utils.formatCurrency(p.precioMxn)}</span></div>
          </div>
        </div>
      `).join('') : '<p style="color:var(--ink2)">No hay más piezas por ahora.</p>';
    } catch { /* no bloquea la vista principal */ }
  }

  function openBuyModal() {
    document.getElementById('buy-piece-name').textContent = `${tipoMuebleLabel(piece.tipoMueble)} · ${Utils.formatCurrency(piece.precioMxn)}`;
    document.getElementById('buy-error').classList.remove('visible');
    document.getElementById('buy-success').style.display = 'none';
    document.getElementById('buy-confirm-btn').disabled = false;
    Modal.open('modal-buy');
  }

  async function confirmPurchase() {
    const errEl = document.getElementById('buy-error');
    const user = Auth.getCurrentUser();
    if (!user) {
      Toast.show('Inicia sesión como comprador para continuar', 'info');
      window.location.href = '/login';
      return;
    }
    if (user.tipo !== 'comprador') {
      errEl.textContent = 'Solo las cuentas de tipo comprador pueden iniciar una compra.';
      errEl.classList.add('visible');
      return;
    }
    try {
      const resp = await Api.iniciarCompraPiezaCatalogo(catalogoId);
      document.getElementById('buy-confirm-btn').disabled = true;
      errEl.classList.remove('visible');
      const successEl = document.getElementById('buy-success');
      successEl.style.display = 'block';
      successEl.innerHTML = `<strong>¡Compra iniciada!</strong><br>Link de pago (simulado): <a href="#" onclick="return false">${resp.urlPagoStripe}</a>`;
      Toast.show('Compra iniciada. Revisa el link de pago simulado.', 'success', 5000);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('visible');
    }
  }

  cargarPieza();
</script>
</body>
</html>
