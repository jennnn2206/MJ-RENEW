<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprar — MJ Renew</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header" id="site-header"></header>

<div class="dashboard-layout">
  <aside class="dashboard-sidebar">
    <div class="sidebar-section">
      <div style="padding:16px 12px 20px;border-bottom:1px solid var(--bg3);margin-bottom:16px">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="user-avatar" id="sb-avatar" style="width:42px;height:42px;font-size:1rem;background:var(--brown3)"></div>
          <div>
            <div style="font-weight:600;font-size:1rem;color:var(--ink)" id="sb-name"></div>
            <div style="font-size:1rem;color:var(--ink2)">Comprador</div>
          </div>
        </div>
      </div>
      <div class="sidebar-label">Explorar</div>
      <button class="sidebar-nav-item active" onclick="showSection('catalogo')">Catálogo</button>
      <button class="sidebar-nav-item" onclick="showSection('favoritos')">Favoritos</button>
      <button class="sidebar-nav-item" onclick="showSection('compras')">Mis compras</button>
      <button class="sidebar-nav-item" onclick="Auth.logout().then(() => window.location.href='/login')">Cerrar sesión</button>
    </div>
  </aside>

  <main class="dashboard-main">

    <!-- CATÁLOGO -->
    <div id="section-catalogo" class="dash-section">
      <div style="margin-bottom:24px">
        <h2 id="welcome-title" style="font-size:1.8rem"></h2>
        <p style="color:var(--ink2)">Encuentra piezas únicas con historia verificada</p>
      </div>

      <div style="max-width:540px;margin-bottom:20px">
        <div class="search-bar">
          <input class="search-input" id="search-input" placeholder="Busca por tipo de mueble..." oninput="filterCatalog()">
          <button class="search-btn" onclick="filterCatalog()">Buscar</button>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap" id="tag-filters">
        <button class="btn btn-ghost btn-sm" onclick="filterByTipo('')">Todos</button>
      </div>

      <div class="catalog-grid" id="dashboard-catalog"></div>
    </div>

    <!-- FAVORITOS -->
    <div id="section-favoritos" class="dash-section" style="display:none">
      <div style="margin-bottom:24px">
        <h2 style="font-size:1.5rem">Mis favoritos</h2>
        <p style="color:var(--ink2)">Piezas que has guardado para después</p>
      </div>
      <div class="catalog-grid" id="favs-grid"></div>
    </div>

    <!-- COMPRAS -->
    <div id="section-compras" class="dash-section" style="display:none">
      <h2 style="font-size:1.5rem;margin-bottom:24px">Mis compras</h2>
      <div class="empty-state">
        <h3>Aún no tienes compras</h3>
        <p>Las piezas que adquieras aparecerán aquí con su estado de envío.</p>
        <button class="btn btn-primary" onclick="showSection('catalogo')">Explorar el catálogo</button>
      </div>
    </div>

  </main>
</div>

<script th:src="@{/js/data/afd-estados.js}"></script>
<script th:src="@{/js/data/catalogo.js}"></script>
<script th:src="@{/js/data/restauradores.js}"></script>
<script th:src="@{/js/data/piezas-propietario.js}"></script>
<script th:src="@{/js/data/panel-restaurador.js}"></script>
<script th:src="@{/js/autenticacion.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/utilidades.js}"></script>
<script th:src="@{/js/notificaciones.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
  const user = Auth.requireAuth('/login', 'comprador');
  if (user) {
    document.getElementById('welcome-title').textContent = `Hola, ${user.name.split(' ')[0]}`;
    document.getElementById('sb-name').textContent = user.name;
    document.getElementById('sb-avatar').textContent = Utils.initials(user.name);
    renderHeader(false);
  }

  function showSection(id) {
    document.querySelectorAll('.dash-section').forEach(s => s.style.display = 'none');
    document.getElementById('section-' + id).style.display = 'block';
    document.querySelectorAll('.sidebar-nav-item').forEach(b => b.classList.remove('active'));
    const btn = [...document.querySelectorAll('.sidebar-nav-item')].find(b => b.onclick?.toString().includes(`'${id}'`));
    if (btn) btn.classList.add('active');
    if (id === 'favoritos') renderFavs();
  }

  let catalogoCompleto = [];

  function piezaCardHtml(p) {
    return `
      <div class="piece-card" onclick="viewPiece('${p.catalogoId}')">
        <div class="piece-card-img-wrap">
          <img src="${fotoConFallback(p.urlFotoPortada)}" alt="${tipoMuebleLabel(p.tipoMueble)}" loading="lazy">
          <button class="piece-card-fav ${isFavId(p.catalogoId) ? 'active' : ''}"
            onclick="event.stopPropagation(); toggleFav('${p.catalogoId}', this)" aria-label="Agregar a favoritos">♡</button>
          <span class="piece-card-status"><span class="badge badge-green">Restaurado</span></span>
        </div>
        <div class="piece-card-body">
          <div class="piece-card-tag">${tipoMuebleLabel(p.tipoMueble)}</div>
          <h4>${tipoMuebleLabel(p.tipoMueble)}</h4>
          <div class="piece-card-meta"><span class="piece-card-price">${Utils.formatCurrency(p.precioMxn)}</span></div>
        </div>
      </div>
    `;
  }

  function renderGridInto(containerId, list) {
    const el = document.getElementById(containerId);
    el.innerHTML = list.length ? list.map(piezaCardHtml).join('')
            : `<div class="empty-state" style="grid-column:1/-1"><h3>Sin resultados</h3><p>Intenta con otra búsqueda.</p></div>`;
  }

  async function cargarCatalogo() {
    try {
      const page = await Api.explorarCatalogo();
      catalogoCompleto = page.content || [];
    } catch (err) {
      Toast.show('No se pudo cargar el catálogo: ' + err.message, 'error');
      catalogoCompleto = [];
    }
    const tipos = [...new Set(catalogoCompleto.map(p => p.tipoMueble))];
    document.getElementById('tag-filters').innerHTML =
            `<button class="btn btn-ghost btn-sm" onclick="filterByTipo('')">Todos</button>` +
            tipos.map(t => `<button class="btn btn-ghost btn-sm" onclick="filterByTipo('${t}')">${tipoMuebleLabel(t)}</button>`).join('');
    renderGridInto('dashboard-catalog', catalogoCompleto);
  }

  let currentTipo = '';
  function filterByTipo(tipo) {
    currentTipo = tipo;
    const search = document.getElementById('search-input').value.toLowerCase().trim();
    let result = catalogoCompleto;
    if (tipo) result = result.filter(p => p.tipoMueble === tipo);
    if (search) result = result.filter(p => tipoMuebleLabel(p.tipoMueble).toLowerCase().includes(search));
    renderGridInto('dashboard-catalog', result);
  }

  function filterCatalog() { filterByTipo(currentTipo); }

  function isFavId(id) {
    const favs = JSON.parse(localStorage.getItem('mjrenew_favs') || '[]');
    return favs.includes(id);
  }

  function toggleFav(id, btn) {
    let favs = JSON.parse(localStorage.getItem('mjrenew_favs') || '[]');
    const idx = favs.indexOf(id);
    if (idx === -1) { favs.push(id); btn.textContent = '♥'; btn.classList.add('active'); Toast.show('Agregado a favoritos', 'success'); }
    else { favs.splice(idx, 1); btn.textContent = '♡'; btn.classList.remove('active'); Toast.show('Eliminado de favoritos', 'info'); }
    localStorage.setItem('mjrenew_favs', JSON.stringify(favs));
  }

  function renderFavs() {
    const favs = JSON.parse(localStorage.getItem('mjrenew_favs') || '[]');
    const favPieces = catalogoCompleto.filter(p => favs.includes(p.catalogoId));
    renderGridInto('favs-grid', favPieces);
  }

  window.viewPiece = (id) => { window.location.href = `/pieza?id=${id}`; };

  cargarCatalogo();
  // MJRENEW-STRIPE: solo el webhook confirma la venta.
  const resultadoPago = new URLSearchParams(window.location.search).get('pago');
  if (resultadoPago === 'exitoso') {
    Toast.show('Regresaste de Stripe. Espera la confirmación de tu compra.', 'info', 7000);
  } else if (resultadoPago === 'cancelado') {
    Toast.show('No se completó el pago. La reserva vencerá si no se paga.', 'info', 6000);
  }
</script>
</body>
</html>
