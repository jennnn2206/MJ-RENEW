<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — MJ Renew</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="site-header" id="site-header"></header>

<!-- Page Header -->
<div class="page-header">
  <div class="container">
    <div class="page-header-inner">
      <div>
        <h1>Catálogo de piezas</h1>
        <p>Muebles restaurados con historia verificada</p>
      </div>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container" style="padding-top:32px;padding-bottom:60px">
  <!-- Search -->
  <div style="max-width:540px;margin-bottom:28px">
    <div class="search-bar">
      <input class="search-input" id="search-input" placeholder="Busca por tipo de mueble..." oninput="filterCatalog()">
      <button class="search-btn" onclick="filterCatalog()">Buscar</button>
    </div>
  </div>

  <!-- Active filters -->
  <div id="active-filters" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px"></div>

  <div class="catalog-layout">
    <!-- Sidebar Filters -->
    <aside class="catalog-sidebar">
      <h4 style="font-family:'Playfair Display',serif;margin-bottom:20px;font-size:1.05rem">Filtros</h4>

      <div class="filter-group">
        <div class="filter-label">Tipo de mueble</div>
        <div class="filter-options" id="filter-tipo-options"></div>
      </div>

      <div class="filter-group">
        <div class="filter-label">Precio máximo</div>
        <input type="range" id="price-range" min="1000" max="100000" value="100000" step="1000"
               oninput="document.getElementById('price-val').textContent='$'+Number(this.value).toLocaleString('es-MX');filterCatalog()"
               style="width:100%;accent-color:var(--brown);margin-bottom:6px">
        <div style="display:flex;justify-content:space-between;font-size:1rem;color:var(--ink2)">
          <span>$1,000</span>
          <span id="price-val" style="font-weight:600;color:var(--brown)">$100,000</span>
        </div>
      </div>

      <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:8px" onclick="clearFilters()">
        Limpiar filtros
      </button>

      <hr class="divider">

      <div style="background:var(--bg2);border-radius:8px;padding:14px;font-size:1rem;color:var(--ink2);text-align:center">
        <strong style="display:block;margin-bottom:4px;color:var(--ink)">¿Buscas algo específico?</strong>
        Contáctanos y te ayudamos a encontrar la pieza ideal.
        <div style="margin-top:10px"><a href="mailto:hola@mjrenew.mx" class="btn btn-ghost btn-sm" style="width:100%;justify-content:center">Contactar</a></div>
      </div>
    </aside>

    <!-- Catalog Grid -->
    <div>
      <div class="results-row">
        <p id="results-count">Cargando piezas...</p>
        <select class="sort-select" onchange="sortCatalog(this.value)" aria-label="Ordenar piezas">
          <option value="default">Orden: Destacados</option>
          <option value="precio-asc">Precio: menor a mayor</option>
          <option value="precio-desc">Precio: mayor a menor</option>
        </select>
      </div>
      <div class="catalog-grid" id="catalog-grid"></div>
    </div>
  </div>
</div>

<div th:replace="~{fragmentos/pie-pagina :: pie-pagina('/', 'Volver al inicio')}"></div>

<script th:src="@{/js/data/afd-estados.js}"></script>
<script th:src="@{/js/data/catalogo.js}"></script>
<script th:src="@{/js/data/restauradores.js}"></script>
<script th:src="@{/js/data/piezas-propietario.js}"></script>
<script th:src="@{/js/data/panel-restaurador.js}"></script>
<script th:src="@{/js/autenticacion.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/utilidades.js}"></script>
<script th:src="@{/js/notificaciones.js}"></script>
<script th:src="@{/js/modal.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script>
  renderHeader(false);

  // Catálogo real (/api/catalogo/explorarCatalogo), no el mock CATALOG de
  // js/data/catalogo.js que usa la landing page. Los campos disponibles son
  // menos ricos que el mockup (no hay época, material ni tags), así que el
  // grid se arma a mano en vez de reusar renderCatalogGrid().
  let catalogoCompleto = [];
  let currentCatalog = [];

  async function cargarCatalogo() {
    try {
      const page = await Api.explorarCatalogo();
      catalogoCompleto = page.content || [];
    } catch (err) {
      Toast.show('No se pudo cargar el catálogo: ' + err.message, 'error');
      catalogoCompleto = [];
    }
    construirFiltroTipo();
    currentCatalog = [...catalogoCompleto];
    renderGrid();
  }

  function construirFiltroTipo() {
    const tipos = [...new Set(catalogoCompleto.map(p => p.tipoMueble))];
    document.getElementById('filter-tipo-options').innerHTML = tipos.map(t => `
      <label class="filter-check"><input type="checkbox" value="${t}" onchange="filterCatalog()"> ${tipoMuebleLabel(t)}</label>
    `).join('');
  }

  function piezaCardHtml(p) {
    return `
      <div class="piece-card" onclick="viewPiece('${p.catalogoId}')">
        <div class="piece-card-img-wrap">
          <img src="${fotoConFallback(p.urlFotoPortada)}" alt="${tipoMuebleLabel(p.tipoMueble)}" loading="lazy">
          <span class="piece-card-status"><span class="badge badge-green">Restaurado</span></span>
        </div>
        <div class="piece-card-body">
          <div class="piece-card-tag">${tipoMuebleLabel(p.tipoMueble)}</div>
          <h4>${tipoMuebleLabel(p.tipoMueble)}</h4>
          <div class="piece-card-meta">
            <span class="piece-card-price">${Utils.formatCurrency(p.precioMxn)}</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderGrid() {
    const count = currentCatalog.length;
    document.getElementById('results-count').textContent = `Mostrando ${count} pieza${count !== 1 ? 's' : ''}`;
    const grid = document.getElementById('catalog-grid');
    grid.innerHTML = currentCatalog.length
      ? currentCatalog.map(piezaCardHtml).join('')
      : `<div class="empty-state" style="grid-column:1/-1"><h3>Sin resultados</h3><p>Intenta con otros filtros o términos de búsqueda.</p></div>`;
  }

  function filterCatalog() {
    const search = document.getElementById('search-input').value.toLowerCase().trim();
    const tipos = [...document.querySelectorAll('#filter-tipo-options input[type=checkbox]:checked')].map(cb => cb.value);
    const maxP = parseInt(document.getElementById('price-range').value);

    let result = catalogoCompleto;
    if (search) result = result.filter(p => tipoMuebleLabel(p.tipoMueble).toLowerCase().includes(search));
    if (tipos.length) result = result.filter(p => tipos.includes(p.tipoMueble));
    result = result.filter(p => p.precioMxn <= maxP);

    currentCatalog = result;
    renderGrid();
    renderActiveFilters(tipos, search);
  }

  function renderActiveFilters(tipos, search) {
    const af = document.getElementById('active-filters');
    const all = [...tipos.map(tipoMuebleLabel), ...(search ? [`"${search}"`] : [])];
    af.innerHTML = all.map(f => `<span class="badge badge-brown" style="gap:6px">${f} <span style="cursor:pointer;opacity:0.7" onclick="clearFilters()">×</span></span>`).join('');
  }

  function clearFilters() {
    document.querySelectorAll('#filter-tipo-options input[type=checkbox]').forEach(cb => cb.checked = false);
    document.getElementById('price-range').value = 100000;
    document.getElementById('price-val').textContent = '$100,000';
    document.getElementById('search-input').value = '';
    document.getElementById('active-filters').innerHTML = '';
    currentCatalog = [...catalogoCompleto];
    renderGrid();
  }

  function sortCatalog(type) {
    if (type === 'precio-asc') currentCatalog.sort((a, b) => a.precioMxn - b.precioMxn);
    else if (type === 'precio-desc') currentCatalog.sort((a, b) => b.precioMxn - a.precioMxn);
    else currentCatalog = [...catalogoCompleto];
    renderGrid();
  }

  window.viewPiece = (id) => { window.location.href = `/pieza?id=${id}`; };

  cargarCatalogo();
</script>
</body>
</html>
