<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Crear nueva contraseña — MJ Renew</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div class="auth-page">
  <main class="auth-card">
    <div th:replace="~{fragmentos/logo-autenticacion :: logo-autenticacion('Elige tu nueva contraseña')}"></div>
    <h3>Restablecer contraseña</h3>
    <p class="auth-description">Escribe una contraseña de al menos 8 caracteres y confírmala para guardar el cambio.</p>
    <form id="restablecer-form" hidden>
      <div class="form-group">
        <label class="form-label" for="nueva-contrasena">Nueva contraseña</label>
        <input type="password" id="nueva-contrasena" class="form-control" minlength="8"
               autocomplete="new-password" aria-describedby="contrasena-ayuda" required>
        <p id="contrasena-ayuda" class="form-hint">Usa al menos 8 caracteres y elige una contraseña que no utilices en otros sitios.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmar-contrasena">Confirmar nueva contraseña</label>
        <input type="password" id="confirmar-contrasena" class="form-control" minlength="8" autocomplete="new-password" required>
      </div>
      <button type="submit" id="restablecer-submit" class="btn btn-primary auth-submit">Guardar nueva contraseña</button>
    </form>
    <p id="restablecer-resultado" class="auth-feedback" role="status" aria-live="polite"></p>
    <nav class="auth-actions">
      <a th:href="@{/login}">Ir a iniciar sesión</a>
      <a th:href="@{/recuperar-contrasena}" id="solicitar-otro-enlace">Solicitar otro enlace</a>
    </nav>
  </main>
</div>
<script th:src="@{/js/autenticacion.js}"></script>
<script th:src="@{/js/recuperacion-contrasena.js}"></script>
</body>
</html>
