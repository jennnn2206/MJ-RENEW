spring.application.name=mjrenew-backend
server.port=${PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}

# Las credenciales de despliegue se proporcionan mediante variables de entorno.
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/MJRenew-DB}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.thymeleaf.cache=false

# ============================================================
# PostgreSQL
# ============================================================

spring.config.import=optional:classpath:application-local.properties

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Almacenamiento de archivos (MinIO / S3-compatible)
# ============================================================
# Valores por defecto para desarrollo local con el docker-compose.yml del
# proyecto; sobreescribe en application-local.properties si usas otra instancia.

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:mjrenew}
minio.secret-key=${MINIO_SECRET_KEY:mjrenew123}
minio.bucket=${MINIO_BUCKET:mjrenew-fotos}
