spring.application.name=mjrenew-backend
# Procesa las liberaciones pendientes mediante Stripe Connect.
mjrenew.stripe.transfers-enabled=${STRIPE_TRANSFERS_ENABLED:false}
server.port=${PORT:8080}
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}

# RF-002. Usar un servidor SMTP local de pruebas o configurar el proveedor real.
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mjrenew.correo.remitente=${MAIL_FROM:no-reply@mjrenew.mx}
# RF-004 exige vigencia limitada. Los 30 minutos son un valor técnico configurable.
mjrenew.auth.recuperacion.vigencia-minutos=${PASSWORD_RESET_TTL_MINUTES:30}

# Las credenciales de despliegue se proporcionan mediante variables de entorno.
spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/MJRenew-DB}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.thymeleaf.cache=false

# Evidencias fotográficas, incluyendo el lote final de RF-017.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ============================================================
# PostgreSQL
# ============================================================

spring.config.import=optional:classpath:application-local.properties

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Almacenamiento de archivos (MinIO / S3-compatible)
# ============================================================
# Valores por defecto para desarrollo local con el docker-compose.yml del
# proyecto; sobreescribe en application-local.properties si usas otra instancia.

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:mjrenew}
minio.secret-key=${MINIO_SECRET_KEY:mjrenew123}
minio.bucket=${MINIO_BUCKET:mjrenew-fotos}
