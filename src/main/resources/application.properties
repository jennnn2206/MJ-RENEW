spring.application.name=mjrenew-backend

spring.thymeleaf.cache=false

# ============================================================
# PostgreSQL
# ============================================================

spring.config.import=optional:classpath:application-local.properties

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Almacenamiento de archivos (MinIO / S3-compatible)
# ============================================================
# Valores por defecto para desarrollo local con el docker-compose.yml del
# proyecto; sobreescribe en application-local.properties si usas otra instancia.

minio.endpoint=http://localhost:9000
minio.access-key=mjrenew
minio.secret-key=mjrenew123
minio.bucket=mjrenew-fotos